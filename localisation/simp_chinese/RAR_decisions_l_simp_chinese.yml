 BUL_FACTION: "巴尔干战事"
 make_faction: "联盟提议"
 least_chance: "最后机会"
 back_ass: "背刺"
 LON_DEVELOP: "不列颠开发署"
 ENGLAND_IND: "扩张英格兰工业"
 BULS_IND: "布里斯托尔计划"
 BULS_IND_desc: "布里斯托尔是不列颠的西方明珠，是面向大西洋的最大海港。然而，身为不列颠第二大城市之一，布里斯托尔的工业却稍显落后的。我们将改变这一现状，增强其工业能力，并吸引外来人口。"
 WLS_IND: "开发威尔士煤矿"
 WLS_IND_desc: "威尔士的煤矿储量是欧洲最为优越的，质量也令欧洲叹为观止。不过，当地受限于许多问题，难以完美开采煤矿。好在，在我国的力量下，我国便能扩大当地开采。"
 LWT_IND: "默西塞德工业区"
 LWT_IND_desc: "默齐河作为不列颠中部的重要河流，近年来发展非常迅速，利物浦也已经成为英国重镇。然而，默齐河两岸的大量闲置土地都没能利用起来。如果将其有序地改造，此地便将成为工业的新中心。"
 NEWB_IND: "旧邦新命"
 NEWB_IND_desc: "约克，作为罗马时代“第二不列颠”的首府，约克王国的首都，一直作为一个强大的权力与军事堡垒存在。但今时不同往日，约克的政治地位已经没落，而不列颠要做的，便是让它作为一个经济中心而转型。"
 GLA_IND: "加强格拉斯哥造船业"
 GLA_IND_desc: "格拉斯哥是苏格兰发展最发达的城市，但当地高技能工人的缺乏严重影响着发展，但通过拓展产业区域，我们便能达到双赢的效果。"
 GLA_IND: "福斯湾沿岸计划"
 GLA_IND_desc: "福斯湾沿岸数百年来一直是北不列颠的中心，拥有相较完善的工业与经济。但在大量人口迁入此地后，福斯湾沿岸，尤其是南岸，必须有一次转型升级的动力。"
 